name: Portabilidade
on: [push, pull_request]
jobs:
  sintetico:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POLARS_MAX_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest -rs
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Amostra (make no POSIX, executor Python no Windows)
        run: uv run python .github/scripts/amostra.py
