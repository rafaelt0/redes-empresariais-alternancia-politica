[project]
name = "redes"
version = "0.1.0"
description = "Redes empresariais e persistência econômica sob alternância política"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "duckdb",
    "matplotlib",
    "polars",
    "pyarrow",
    "python-igraph",
    "python-pptx",
    "rddensity",
    "rdrobust",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
